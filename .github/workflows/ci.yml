name: Check
# Runs on every change that is not published yet (pull requests and other branches).
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check the projects (friendly error messages)
        run: python scripts/build.py --out /tmp/check-build
      - name: Run tests
        run: python -m pytest -q
