name: Check
# Runs on every change that is not published yet (pull requests and other branches).
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python -m playwright install --with-deps chromium
      - name: Check the projects (friendly error messages)
        run: uv run --locked python scripts/build.py --out /tmp/check-build
      - name: Run tests
        run: uv run --locked pytest -q
